name: biomni_e1
channels:
  - conda-forge
  - defaults
  - bioconda
dependencies:
  - python=3.11
  - pip
  - pip:
      - numpy==2.1
      - pandas
      - matplotlib
      - scipy
      - statsmodels
      - scikit-learn
      - gradio
      - langchain
      - langgraph==0.3.18
      - langchain-openai
      - langchain-anthropic
      - langchain-ollama
      - langchain-community
      - openai
      - beautifulsoup4
      - lxml
      - tqdm
      - seaborn
      - networkx
      - requests
      - pyyaml
      - jupyter
      - notebook
      - ipykernel
      - pytest
      - transformers
      - sentencepiece
      - mcp
      - tooluniverse
      - python-dotenv
      # data lake / file formats
      - pyarrow>=15.0.0  # >=15 required for NumPy 2.x compatibility
      - fastparquet
      # literature & web search tools
      - pymed
      - googlesearch-python
      - PyPDF2
      # image handling
      - pillow
      # biomni server
      - flask
